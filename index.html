<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEADZONE</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#e8eee9;font-family:Arial,sans-serif;overflow:hidden}button{cursor:pointer;background:#101613;color:#dce6df;border:1px solid #617068;padding:10px 16px}button:hover{background:#1b2520}.hide{display:none!important}#fade{position:fixed;inset:0;background:#000;z-index:50;pointer-events:none;opacity:1;transition:opacity 1.2s}.scene{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 58% 50%,rgba(170,200,185,.14),transparent 18%),linear-gradient(#07100d,#020504 60%,#000);animation:pulse 7s infinite}.scene:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.7),transparent 35%,transparent 70%,rgba(0,0,0,.75))}.rain{position:absolute;inset:-30%;opacity:.25;background:repeating-linear-gradient(105deg,transparent 0 13px,rgba(220,235,230,.3) 14px,transparent 15px 29px);animation:rain .65s linear infinite}.shadow{position:absolute;left:62%;bottom:18%;width:70px;height:210px;background:#020303;border-radius:45% 45% 15% 15%;filter:blur(2px);animation:move 6s infinite}.shadow:before{content:"";position:absolute;left:9px;top:-43px;width:52px;height:55px;border-radius:50%;background:#020303}.bar{position:fixed;left:0;width:100%;height:7vh;background:#000;z-index:47}.top{top:0}.bottom{bottom:0}.story{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center}.panel{width:min(820px,90vw);text-align:center;padding:35px}.text{min-height:150px;font-size:19px;line-height:1.8;text-shadow:0 2px 18px #000}.skip{position:fixed;right:20px;top:18px;z-index:48}.small{font-size:10px;letter-spacing:3px;color:#89958e;margin-top:15px}.auto,.voice{margin-top:14px;font-size:9px;letter-spacing:2px}.ending{position:fixed;inset:0;z-index:60;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 2s}.ending.show{opacity:1}.endingCard{text-align:center;transform:scale(.96);transition:transform 2.5s}.ending.show .endingCard{transform:scale(1)}.endingSmall{font-size:11px;letter-spacing:7px;color:#68736d;margin-bottom:22px}.endingTitle{font-size:clamp(55px,12vw,150px);letter-spacing:15px;margin:0}.endingLine{margin-top:20px;font-size:11px;letter-spacing:4px;color:#7e8a83}.menu{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#050806}.title{font-size:clamp(48px,10vw,110px);letter-spacing:14px;margin:0}.menu{text-align:center}.menu button{display:block;width:260px;margin:12px auto}.game{display:none!important}@keyframes rain{to{transform:translate(-80px,100px)}}@keyframes pulse{0%,100%{filter:brightness(.8)}50%{filter:brightness(1.05)}}@keyframes move{0%,100%{transform:translateX(0)}50%{transform:translateX(-35px)}}</style></head><body><div id="fade"></div><div class="scene" id="scene"><div class="rain"></div><div class="shadow"></div></div><div class="bar top" id="top"></div><div class="bar bottom" id="bottom"></div><section class="story" id="story"><button class="skip" id="skip">SKIP</button><div class="panel"><div class="text" id="text"></div><div class="small">CLICK / SPACE / ENTER</div><button class="auto" id="auto">AUTOMATIC CONTINUE: OFF</button><button class="voice" id="voice">VOICE: ON</button></div></section><section class="ending" id="ending"><div class="endingCard"><div class="endingSmall">THE STORY WILL CONTINUE</div><h1 class="endingTitle">COMING SOON</h1><div class="endingLine">DEADZONE IS CURRENTLY IN PROGRESS</div></div></section><script>const lines=["YEAR 2041 — DES MOINES, IOWA","You are Ethan Cole, a 17-year-old high-school senior.","At 3:17 AM, you wake up. The city is completely silent.","Your phone lights up: EMERGENCY ALERT — DO NOT LEAVE YOUR HOME.","You look outside. A figure stands across the street.","Then you hear a THUD downstairs.","Your sister Mia is gone. Her room is empty.","A message from your mother appears: Ethan... don't look for us.","The lights die.","You escape through the back door and find an abandoned military radio.","Static... then a voice: YOUR SISTER IS ALIVE.","THE OBJECTIVE: FIND MIA.","You step into the darkness.","But when you see a shadow behind you...","(ZOMBIE ROARS)","...you're not alone."];let n=0,typing=false,timer,auto=false,voice=true;const text=document.getElementById('text'),fade=document.getElementById('fade');function ac(){return window.AudioContext||window.webkitAudioContext}function roar(){try{let C=ac();if(!C)return;let c=new C,o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(110,c.currentTime);o.frequency.exponentialRampToValueAtTime(34,c.currentTime+1.5);f.type='lowpass';f.frequency.value=600;g.gain.setValueAtTime(.001,c.currentTime);g.gain.exponentialRampToValueAtTime(.42,c.currentTime+.05);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+1.7);o.connect(f);f.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+1.8);setTimeout(()=>c.close(),2100)}catch(e){}}function power(){try{let C=ac();if(!C)return;let c=new C,m=c.createGain(),t=c.currentTime;m.connect(c.destination);m.gain.value=.7;for(let i=0;i<3;i++){let o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(150-i*25,t+i*.08);o.frequency.exponentialRampToValueAtTime(38,t+i*.08+.35);f.type='lowpass';f.frequency.value=850;g.gain.setValueAtTime(.001,t+i*.08);g.gain.exponentialRampToValueAtTime(.25,t+i*.08+.03);g.gain.exponentialRampToValueAtTime(.001,t+i*.08+.5);o.connect(f);f.connect(g);g.connect(m);o.start(t+i*.08);o.stop(t+i*.08+.55)}setTimeout(()=>c.close(),1800)}catch(e){}}function speak(s){if(!voice||!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.rate=.92;u.pitch=.9;u.volume=.75;speechSynthesis.speak(u)}function next(){if(n>=lines.length)return finish();clearInterval(timer);let s=lines[n++];if(s==='(ZOMBIE ROARS)')roar();text.textContent='';typing=true;let i=0;timer=setInterval(()=>{text.textContent=s.slice(0,++i);if(i>=s.length){clearInterval(timer);typing=false;speak(s);if(auto)setTimeout(next,900)}},24)}function finish(){clearInterval(timer);if(speechSynthesis)speechSynthesis.cancel();document.getElementById('story').classList.add('hide');document.getElementById('scene').classList.add('hide');document.getElementById('top').classList.add('hide');document.getElementById('bottom').classList.add('hide');setTimeout(()=>{document.getElementById('ending').classList.add('show');power();setTimeout(()=>fade.style.opacity='1',1200)},250)}document.getElementById('skip').onclick=finish;document.getElementById('auto').onclick=e=>{auto=!auto;e.textContent='AUTOMATIC CONTINUE: '+(auto?'ON':'OFF');if(auto&&!typing)next()};document.getElementById('voice').onclick=e=>{voice=!voice;e.textContent='VOICE: '+(voice?'ON':'OFF');if(!voice&&speechSynthesis)speechSynthesis.cancel()};document.addEventListener('keydown',e=>{if(document.getElementById('story').classList.contains('hide'))return;if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(typing){clearInterval(timer);typing=false;text.textContent=lines[n-1];speak(lines[n-1])}else next()}});setTimeout(()=>{fade.style.opacity='0';next()},900);</script></body></html>
