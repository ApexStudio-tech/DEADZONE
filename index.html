<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEADZONE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#e8eee9;font-family:Arial,sans-serif}body{overflow:hidden}button{cursor:pointer;background:#101613;color:#dce6df;border:1px solid #617068;padding:10px 16px}button:hover{background:#1b2520}.hide{display:none!important}
#fade{position:fixed;inset:0;background:#000;z-index:50;pointer-events:none;opacity:1;transition:opacity 1.2s}
#letterboxTop,#letterboxBottom{position:fixed;left:0;width:100%;height:0;background:#000;z-index:45;transition:height 1s;pointer-events:none}#letterboxTop{top:0}#letterboxBottom{bottom:0}
.cinemaScene{position:fixed;inset:0;z-index:42;pointer-events:none;overflow:hidden;background:radial-gradient(circle at 58% 52%,rgba(180,210,194,.16),transparent 18%),linear-gradient(#07100d 0%,#020504 58%,#000 100%);animation:scenePulse 8s ease-in-out infinite}.cinemaScene:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.65),transparent 35%,transparent 70%,rgba(0,0,0,.7)),linear-gradient(0deg,rgba(0,0,0,.85),transparent 45%,rgba(0,0,0,.45))}.rain{position:absolute;inset:-30%;opacity:.28;background-image:repeating-linear-gradient(105deg,transparent 0 12px,rgba(210,230,225,.28) 13px,transparent 14px 28px);animation:rainMove .7s linear infinite}.silhouette{position:absolute;left:57%;bottom:17%;width:72px;height:220px;opacity:.72;background:#020303;border-radius:45% 45% 15% 15%;filter:blur(1px);transform:translateX(-50%);animation:figure 7s ease-in-out infinite}.silhouette:before{content:"";position:absolute;left:10px;top:-45px;width:52px;height:58px;background:#020303;border-radius:50%}.cinemaLight{position:absolute;top:20%;width:8px;height:60%;opacity:.12;filter:blur(14px);background:#dceee5;animation:flicker 3s infinite}.lightA{left:25%}.lightB{right:18%;animation-delay:1.2s}.cinemaCaption{position:absolute;left:50%;bottom:15%;transform:translateX(-50%);width:min(850px,88vw);text-align:center;font-size:18px;letter-spacing:2px;line-height:1.6;color:#e6eee9;text-shadow:0 2px 18px #000;opacity:.95}
.storybox{position:fixed;z-index:43;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto}.storypanel{width:min(820px,88vw);text-align:center;padding:36px}.storytext{min-height:210px;font-size:19px;line-height:1.9;text-shadow:0 2px 15px #000}.storyhint{font-size:10px;letter-spacing:3px;color:#88958e;margin-top:16px}.storySkip{position:fixed;right:22px;top:18px;z-index:48}.autoBtn{width:auto;margin:18px auto 0;padding:9px 16px;font-size:9px;letter-spacing:2px;color:#aab6ae}.voiceRow{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:10px;flex-wrap:wrap}.voiceBtn{width:auto;margin:0;padding:9px 14px;font-size:9px;letter-spacing:2px}.voiceVol{width:130px;accent-color:#b9c7be}
.ending{position:fixed;inset:0;z-index:49;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 2s}.ending.show{opacity:1}.endingCard{text-align:center;transform:scale(.96);transition:transform 2.5s}.ending.show .endingCard{transform:scale(1)}.endingSmall{font-size:11px;letter-spacing:7px;color:#68736d;margin-bottom:22px}.endingTitle{font-size:clamp(55px,12vw,150px);letter-spacing:15px;font-weight:900;margin:0;text-shadow:0 0 35px rgba(220,235,225,.12)}.endingLine{margin-top:20px;font-size:11px;letter-spacing:4px;color:#7e8a83}
.menu{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#16231d,#030605 70%)}.menuCard{text-align:center;width:min(650px,90vw);padding:45px}.title{font-size:clamp(48px,10vw,110px);letter-spacing:14px;margin:0 0 8px}.sub{letter-spacing:5px;color:#8d9992}.menu button{display:block;width:260px;margin:12px auto;font-weight:bold;letter-spacing:2px}.game{position:fixed;inset:0;background:#070b09;z-index:10}.cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}.cross:before,.cross:after{content:"";position:absolute;background:#dbe5df}.cross:before{width:18px;height:1px;top:9px}.cross:after{height:18px;width:1px;left:9px}.hud{position:absolute;left:20px;bottom:20px;letter-spacing:2px;font-size:11px}.flash{position:absolute;right:22px;bottom:20px;letter-spacing:2px;font-size:11px}.fakeWorld{position:absolute;inset:0;background:linear-gradient(#18251f 0 48%,#111713 49% 100%)}.house{position:absolute;width:150px;height:120px;background:#171c19;border:2px solid #404a44;bottom:20%;}.house:before{content:"";position:absolute;left:-15px;top:-65px;border-left:90px solid transparent;border-right:90px solid transparent;border-bottom:70px solid #202722}.h1{left:12%}.h2{right:15%;transform:scale(.8)}
@keyframes rainMove{to{transform:translate3d(-80px,100px,0)}}@keyframes scenePulse{0%,100%{filter:brightness(.82)}50%{filter:brightness(1.04)}}@keyframes flicker{0%,9%,11%,45%,47%,100%{opacity:.12}10%,46%{opacity:.03}}@keyframes figure{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-53%) translateY(-5px)}}
</style></head><body>
<div id="fade"></div><div id="cinemaScene" class="cinemaScene"><div class="rain"></div><div class="cinemaLight lightA"></div><div class="cinemaLight lightB"></div><div class="silhouette"></div><div class="cinemaCaption" id="cinemaCaption"></div></div><div id="letterboxTop"></div><div id="letterboxBottom"></div>
<section id="story" class="storybox"><button id="storySkip" class="storySkip">SKIP</button><div class="storypanel"><div id="storyText" class="storytext"></div><div id="storyHint" class="storyhint">CLICK / SPACE / ENTER</div><button id="autoContinue" class="autoBtn">AUTOMATIC CONTINUE: OFF</button><div class="voiceRow"><button id="voiceToggle" class="voiceBtn">VOICE: ON</button><span style="font-size:9px;letter-spacing:2px;color:#7f8b84">VOLUME</span><input id="voiceVolume" class="voiceVol" type="range" min="0" max="100" value="75"></div></div></section>
<section id="ending" class="ending"><div class="endingCard"><div class="endingSmall">THE STORY WILL CONTINUE</div><h1 class="endingTitle">COMING SOON</h1><div class="endingLine">DEADZONE IS CURRENTLY IN PROGRESS</div></div></section>
<section id="menu" class="menu hide"><div class="menuCard"><h1 class="title">DEADZONE</h1><div class="sub">THE NIGHT HAS JUST BEGUN</div><button id="playBtn">PLAY</button><button>SETTINGS</button><button>CONTROLS</button></div></section><section id="game" class="game hide"><div class="fakeWorld"><div class="house h1"></div><div class="house h2"></div></div><div class="cross"></div><div class="hud">HEALTH 100 &nbsp; | &nbsp; AMMO 12</div><div class="flash">FLASHLIGHT 100%</div></section>
<script>
const storyLines=["YEAR 2041","DES MOINES, IOWA","OCTOBER 17","You are Ethan Cole, a 17-year-old high-school senior.","At 3:17 AM, you wake up to a silent city.","No Wi-Fi. No cellular service. No one answers your calls.","Then your phone lights up: EMERGENCY ALERT.","DO NOT LEAVE YOUR HOME.","You look through the curtains. A figure is standing outside.","Your phone vibrates again: IF YOU HEAR SOMEONE ASKING FOR HELP, DO NOT ANSWER.","Then you hear a THUD downstairs.","Your sister Mia is gone. Her room is empty. Her phone is still on the bed.","A voice message from your mother plays: Ethan... don’t come looking for us.","Static.","Then: They’re outside.","The lights die. Something scratches at the front door.","A voice whispers: Ethan... I know you’re in there.","BOOM.","You escape through the back door.","The neighborhood is abandoned. Cars are empty. Smoke covers downtown.","You find a military radio still running.","...if anyone is still alive... DO NOT GO TO THE HOSPITAL.","Static.","...your sister is alive.","You stare into the darkness.","THE OBJECTIVE: FIND MIA. REACH THE RADIO TOWER.","The screen slowly fades to black.","You hear a flashlight click.","CLICK.","The beam turns on.","The abandoned street stretches ahead.","But when you see a shadow behind you...","(ZOMBIE ROARS)","...you’re not alone."];
let storyIndex=0,typing=false,typeTimer=null,autoContinue=false,autoTimer=null,voiceOn=true,voiceVolume=.75,voiceToken=0;
const storyText=document.getElementById('storyText'),storyHint=document.getElementById('storyHint'),fade=document.getElementById('fade');
function stopVoice(){voiceToken++;if('speechSynthesis'in window)window.speechSynthesis.cancel()}
function speakStory(text){stopVoice();if(!voiceOn||!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(text);u.volume=voiceVolume;u.rate=.96;u.pitch=1;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;const my=voiceToken;u.onend=()=>{if(my===voiceToken&&autoContinue&&!typing&&storyIndex<storyLines.length)autoTimer=setTimeout(showStoryLine,450)};u.onerror=()=>{};speechSynthesis.speak(u)}
function cinemaUpdate(t){document.getElementById('cinemaCaption').textContent=t}
function showStoryLine(){if(storyIndex>=storyLines.length){finishStory();return}clearTimeout(autoTimer);const text=storyLines[storyIndex++];cinemaUpdate(text);if(text==='(ZOMBIE ROARS)')playEndingStinger();storyText.textContent='';typing=true;let i=0;clearInterval(typeTimer);typeTimer=setInterval(()=>{storyText.textContent=text.slice(0,++i);if(i>=text.length){clearInterval(typeTimer);typing=false;speakStory(text);if(storyIndex>=storyLines.length)storyHint.textContent='THE STORY IS COMPLETE';else if(autoContinue&&!voiceOn)autoTimer=setTimeout(showStoryLine,1700)}},Math.max(12,32-text.length/10))}
function audioContext(){return window.AudioContext||window.webkitAudioContext}
function playEndingStinger(){try{const C=audioContext();if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain(),b=c.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(105,c.currentTime);o.frequency.exponentialRampToValueAtTime(35,c.currentTime+1.6);b.type='lowpass';b.frequency.value=650;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.38,c.currentTime+.07);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+1.8);o.connect(b);b.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+1.9);setTimeout(()=>c.close(),2200)}catch(e){}}
function playPowerCut(){try{const C=audioContext();if(!C)return;const c=new C(),master=c.createGain();master.gain.value=.75;master.connect(c.destination);const t=c.currentTime;[0,0.08,0.17].forEach((d,i)=>{const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(150-i*25,t+d);o.frequency.exponentialRampToValueAtTime(42,t+d+.28);f.type='lowpass';f.frequency.setValueAtTime(900,t+d);f.frequency.exponentialRampToValueAtTime(180,t+d+.5);g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.22,t+d+.025);g.gain.exponentialRampToValueAtTime(.0001,t+d+.52);o.connect(f);f.connect(g);g.connect(master);o.start(t+d);o.stop(t+d+.55)});const n=c.createBufferSource();const buf=c.createBuffer(1,c.sampleRate*.9,c.sampleRate),a=buf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,1.8);const nf=c.createBiquadFilter();nf.type='bandpass';nf.frequency.value=950;nf.Q.value=.7;const ng=c.createGain();ng.gain.value=.18;n.buffer=buf;n.connect(nf);nf.connect(ng);ng.connect(master);n.start(t+.15);setTimeout(()=>c.close(),1700)}catch(e){}}
function finishStory(){clearInterval(typeTimer);clearTimeout(autoTimer);stopVoice();document.getElementById('story').classList.add('hide');document.getElementById('cinemaScene').classList.add('hide');document.getElementById('letterboxTop').style.height='0';document.getElementById('letterboxBottom').style.height='0';setTimeout(()=>{const e=document.getElementById('ending');e.classList.add('show');playPowerCut();setTimeout(()=>{fade.style.opacity='1'},1200)},300)}
document.getElementById('storySkip').onclick=finishStory;document.getElementById('autoContinue').onclick=e=>{autoContinue=!autoContinue;e.currentTarget.textContent='AUTOMATIC CONTINUE: '+(autoContinue?'ON':'OFF');if(autoContinue&&!typing&&storyIndex<storyLines.length)showStoryLine();if(!autoContinue)clearTimeout(autoTimer)};document.getElementById('voiceToggle').onclick=e=>{voiceOn=!voiceOn;e.currentTarget.textContent='VOICE: '+(voiceOn?'ON':'OFF');if(!voiceOn)stopVoice();else if(!typing&&storyIndex>0)speakStory(storyLines[storyIndex-1])};document.getElementById('voiceVolume').oninput=e=>voiceVolume=+e.target.value/100;document.addEventListener('keydown',e=>{if(e.code==='Escape'||document.getElementById('story').classList.contains('hide'))return;if(['Space','Enter'].includes(e.code)){e.preventDefault();if(typing){clearInterval(typeTimer);typing=false;storyText.textContent=storyLines[storyIndex-1];speakStory(storyLines[storyIndex-1])}else showStoryLine()}});document.getElementById('playBtn').onclick=()=>{document.getElementById('menu').classList.add('hide');document.getElementById('game').classList.remove('hide')};setTimeout(()=>{fade.style.opacity='0';showStoryLine()},1000);
</script></body></html>
