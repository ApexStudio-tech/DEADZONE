<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEADZONE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#e8eee9;font-family:Arial,sans-serif}body{overflow:hidden}button{cursor:pointer;background:#101613;color:#dce6df;border:1px solid #617068;padding:10px 16px}button:hover{background:#1b2520}.hide{display:none!important}
#fade{position:fixed;inset:0;background:#000;z-index:50;pointer-events:none;opacity:1;transition:opacity 1.2s}
#letterboxTop,#letterboxBottom{position:fixed;left:0;width:100%;height:0;background:#000;z-index:45;transition:height 1s;pointer-events:none}#letterboxTop{top:0}#letterboxBottom{bottom:0}
.cinemaScene{position:fixed;inset:0;z-index:42;pointer-events:none;overflow:hidden;background:radial-gradient(circle at 58% 52%,rgba(180,210,194,.16),transparent 18%),linear-gradient(#07100d 0%,#020504 58%,#000 100%);animation:scenePulse 8s ease-in-out infinite}.cinemaScene:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.65),transparent 35%,transparent 70%,rgba(0,0,0,.7)),linear-gradient(0deg,rgba(0,0,0,.85),transparent 45%,rgba(0,0,0,.45))}.rain{position:absolute;inset:-30%;opacity:.28;background-image:repeating-linear-gradient(105deg,transparent 0 12px,rgba(210,230,225,.28) 13px,transparent 14px 28px);animation:rainMove .7s linear infinite}.silhouette{position:absolute;left:57%;bottom:17%;width:72px;height:220px;opacity:.72;background:#020303;border-radius:45% 45% 15% 15%;filter:blur(1px);transform:translateX(-50%);animation:figure 7s ease-in-out infinite}.silhouette:before{content:"";position:absolute;left:10px;top:-45px;width:52px;height:58px;background:#020303;border-radius:50%}.cinemaLight{position:absolute;top:20%;width:8px;height:60%;opacity:.12;filter:blur(14px);background:#dceee5;animation:flicker 3s infinite}.lightA{left:25%}.lightB{right:18%;animation-delay:1.2s}.cinemaCaption{position:absolute;left:50%;bottom:15%;transform:translateX(-50%);width:min(850px,88vw);text-align:center;font-size:18px;letter-spacing:2px;line-height:1.6;color:#e6eee9;text-shadow:0 2px 18px #000;opacity:.95}
.storybox{position:fixed;z-index:43;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto}.storypanel{width:min(820px,88vw);text-align:center;padding:36px}.storytext{min-height:210px;font-size:19px;line-height:1.9;text-shadow:0 2px 15px #000}.storyhint{font-size:10px;letter-spacing:3px;color:#88958e;margin-top:16px}.storySkip{position:fixed;right:22px;top:18px;z-index:48}.autoBtn{width:auto;margin:18px auto 0;padding:9px 16px;font-size:9px;letter-spacing:2px;color:#aab6ae}.voiceRow{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:10px;flex-wrap:wrap}.voiceBtn{width:auto;margin:0;padding:9px 14px;font-size:9px;letter-spacing:2px}.voiceVol{width:130px;accent-color:#b9c7be}
.menu{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#16231d,#030605 70%)}.menuCard{text-align:center;width:min(650px,90vw);padding:45px}.title{font-size:clamp(48px,10vw,110px);letter-spacing:14px;margin:0 0 8px}.sub{letter-spacing:5px;color:#8d9992}.menu button{display:block;width:260px;margin:12px auto;font-weight:bold;letter-spacing:2px}.game{position:fixed;inset:0;background:#070b09;z-index:10}.cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}.cross:before,.cross:after{content:"";position:absolute;background:#dbe5df}.cross:before{width:18px;height:1px;top:9px}.cross:after{height:18px;width:1px;left:9px}.hud{position:absolute;left:20px;bottom:20px;letter-spacing:2px;font-size:11px}.flash{position:absolute;right:22px;bottom:20px;letter-spacing:2px;font-size:11px}.fakeWorld{position:absolute;inset:0;background:linear-gradient(#18251f 0 48%,#111713 49% 100%)}.house{position:absolute;width:150px;height:120px;background:#171c19;border:2px solid #404a44;bottom:20%;}.house:before{content:"";position:absolute;left:-15px;top:-65px;border-left:90px solid transparent;border-right:90px solid transparent;border-bottom:70px solid #202722}.h1{left:12%}.h2{right:15%;transform:scale(.8)}
@keyframes rainMove{to{transform:translate3d(-80px,100px,0)}}@keyframes scenePulse{0%,100%{filter:brightness(.82)}50%{filter:brightness(1.04)}}@keyframes flicker{0%,9%,11%,45%,47%,100%{opacity:.12}10%,46%{opacity:.03}}@keyframes figure{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-53%) translateY(-5px)}}
</style></head><body>
<div id="fade"></div>
<div id="cinemaScene" class="cinemaScene"><div class="rain"></div><div class="cinemaLight lightA"></div><div class="cinemaLight lightB"></div><div class="silhouette"></div><div class="cinemaCaption" id="cinemaCaption"></div></div>
<div id="letterboxTop"></div><div id="letterboxBottom"></div>
<section id="story" class="storybox"><button id="storySkip" class="storySkip">SKIP</button><div class="storypanel"><div id="storyText" class="storytext"></div><div id="storyHint" class="storyhint">CLICK / SPACE / ENTER</div><button id="autoContinue" class="autoBtn">AUTOMATIC CONTINUE: OFF</button><div class="voiceRow"><button id="voiceToggle" class="voiceBtn">VOICE: ON</button><span style="font-size:9px;letter-spacing:2px;color:#7f8b84">VOLUME</span><input id="voiceVolume" class="voiceVol" type="range" min="0" max="100" value="75"></div></div></section>
<section id="menu" class="menu hide"><div class="menuCard"><h1 class="title">DEADZONE</h1><div class="sub">THE NIGHT HAS JUST BEGUN</div><button id="playBtn">PLAY</button><button>SETTINGS</button><button>CONTROLS</button></div></section>
<section id="game" class="game hide"><div class="fakeWorld"><div class="house h1"></div><div class="house h2"></div></div><div class="cross"></div><div class="hud">HEALTH 100 &nbsp; | &nbsp; AMMO 12</div><div class="flash">FLASHLIGHT 100%</div></section>
<script>
const storyLines=["YEAR 2041","DES MOINES, IOWA","OCTOBER 17","You are Ethan Cole, a 17-year-old high-school senior.","Forty-two days from now, you were supposed to walk across a stage, accept your diploma, and finally leave your hometown behind.","Your life wasn't exciting.","School. Friends. Homework. Late-night gaming.","Your part-time job.","And your little sister, Mia, who always stole your headphones and blamed you for everything.","It was ordinary.","Until October 17th.","At 11:48 PM, every television station in the country suddenly went offline.","At 11:52 PM, the internet disappeared.","At 12:06 AM, the city's emergency sirens started.","Nobody knew why.","Then the sirens stopped.","3:17 AM","You wake up to your phone vibrating.","You reach for it without opening your eyes.","1% BATTERY.","No Wi-Fi.","No cellular service.","No notifications.","Your house is completely silent.","You call your parents.","Nothing.","You call Mia.","Nothing.","Then your phone vibrates.","EMERGENCY ALERT","DO NOT LEAVE YOUR HOME.","You stare at it.","A second message appears.","LOCK ALL DOORS AND WINDOWS.","Then another.","IF YOU HEAR SOMEONE ASKING FOR HELP, DO NOT ANSWER.","Your heart starts beating faster.","Someone is standing outside.","You can see their silhouette through the curtains.","You whisper, Hello?","The figure doesn't move.","Then it slowly raises its head.","Your phone vibrates again.","THEY CAN HEAR YOU.","You step away from the window.","The figure disappears.","3:29 AM","You hear something downstairs.","THUD.","You freeze.","THUD.","Something is walking through the house.","You grab the flashlight beside your bed.","You slowly open your bedroom door.","The hallway is empty.","Your sister's bedroom door is open.","You walk toward it.","Her room is empty.","Her bed is still warm.","Her backpack is on the floor.","Her phone is lying beside it.","You pick it up.","One notification.","MISSED CALL — MOM.","You press play on a voice message.","Your mother's voice whispers: Ethan... don't come looking for us.","Static.","Then: They're outside.","The recording ends.","3:41 AM","You leave your bedroom.","Every light in the house turns off.","The flashlight flickers.","You hear scratching from the front door.","Then a voice.","Ethan?","You recognize it.","It's your neighbor, Mr. Harris.","He sounds terrified.","Please... open the door.","You reach for the lock.","Then you remember the emergency message.","DO NOT ANSWER.","The voice changes.","Ethan... I know you're in there.","You step backward.","Something slams against the door.","BOOM.","You run.","3:58 AM","You escape through the back door.","The neighborhood looks completely different.","Cars are abandoned in the streets.","Windows are broken.","Smoke rises from downtown.","There isn't a single person outside.","Then you hear a scream.","You turn.","A person is running toward you.","Behind them... something is chasing them.","They fall.","The thing stops.","It looks at you.","You shine your flashlight at it.","Its face is barely recognizable.","It starts running toward you.","You run.","4:16 AM","You reach the main road.","The entire city has gone dark.","Then you see something that makes you stop.","Every major road has been blocked by military vehicles.","But there are no soldiers.","Only abandoned equipment.","A radio is still running.","You pick it up.","Static.","Then a voice.","...this is Emergency Command...","Static.","...if anyone is still alive...","...DO NOT GO TO THE HOSPITAL.","The transmission becomes distorted.","...the infection isn't spreading through bites...","Silence.","Then:","...it's spreading through the air.","The radio dies.","You look toward downtown.","A huge red glow illuminates the clouds.","Something has happened there.","Something enormous.","4:37 AM","You find a map inside an abandoned police car.","Three locations are circled:","POLICE STATION.","HOSPITAL.","RADIO TOWER.","Someone has written underneath them:","THE TRUTH IS AT THE TOWER.","Then you notice something else.","A fourth location has been crossed out.","YOUR SCHOOL.","You stare at it.","Your school was supposed to be an evacuation center.","Now it's marked:","DO NOT ENTER.","You hear footsteps behind you.","You turn around.","Nothing.","You shine the flashlight between the houses.","Nothing.","Then your radio crackles.","A different voice speaks.","A woman's voice.","Quiet.","Terrified.","Ethan Cole...","You freeze.","Nobody should know your name.","If you're hearing this...","Static.","...your sister is alive.","The transmission ends.","You stare at the radio.","Your hands begin shaking.","For the first time since the city went silent...","You have a reason to keep moving.","THE OBJECTIVE","FIND MIA.","REACH THE RADIO TOWER.","DISCOVER WHAT HAPPENED TO DES MOINES.","SURVIVE THE DEADZONE.","The screen slowly fades to black.","You hear a flashlight click.","CLICK.","The beam turns on.","The abandoned street stretches ahead.","Something moves between the houses.","DEADZONE","THE NIGHT HAS JUST BEGUN."];
let storyIndex=0,typing=false,typeTimer=null,autoContinue=false,autoTimer=null,voiceOn=true,voiceVolume=.75,voiceToken=0,voiceFinished=true;
const storyText=document.getElementById('storyText'),storyHint=document.getElementById('storyHint'),fade=document.getElementById('fade');
function stopVoice(){voiceToken++;if('speechSynthesis'in window)window.speechSynthesis.cancel();voiceFinished=true}
function speakStory(text){stopVoice();if(!voiceOn||!('speechSynthesis'in window)){voiceFinished=true;return}voiceFinished=false;const u=new SpeechSynthesisUtterance(text);u.volume=voiceVolume;const radio=/radio|broadcast|transmission|Emergency Command|STATIC|signal/i.test(text);const chapter=/^YEAR |^DES MOINES|^OCTOBER|^3:|^4:|^THE OBJECTIVE/i.test(text);u.rate=radio?.82:chapter?.88:.98;u.pitch=radio?.72:chapter?.86:1;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;const my=voiceToken;u.onend=()=>{if(my===voiceToken){voiceFinished=true;if(autoContinue&&!typing&&storyIndex<storyLines.length)autoTimer=setTimeout(showStoryLine,450)}};u.onerror=()=>{if(my===voiceToken)voiceFinished=true};speechSynthesis.speak(u)}
function cinemaUpdate(t){document.getElementById('cinemaCaption').textContent=t}
function showStoryLine(){if(storyIndex>=storyLines.length){finishStory();return}clearTimeout(autoTimer);const text=storyLines[storyIndex++];cinemaUpdate(text);storyText.textContent='';typing=true;let i=0;clearInterval(typeTimer);typeTimer=setInterval(()=>{storyText.textContent=text.slice(0,++i);if(i>=text.length){clearInterval(typeTimer);typing=false;speakStory(text);if(storyIndex>=storyLines.length)storyHint.textContent='THE STORY IS COMPLETE';else if(autoContinue&&!voiceOn)autoTimer=setTimeout(showStoryLine,1700)}},Math.max(12,32-text.length/10))}
function finishStory(){clearInterval(typeTimer);clearTimeout(autoTimer);stopVoice();document.getElementById('story').classList.add('hide');document.getElementById('cinemaScene').classList.add('hide');document.getElementById('letterboxTop').style.height='0';document.getElementById('letterboxBottom').style.height='0';fade.style.opacity='1';setTimeout(()=>{document.getElementById('menu').classList.remove('hide');fade.style.opacity='0'},900)}
document.getElementById('storySkip').onclick=finishStory;document.getElementById('autoContinue').onclick=e=>{autoContinue=!autoContinue;e.currentTarget.textContent='AUTOMATIC CONTINUE: '+(autoContinue?'ON':'OFF');if(autoContinue&&!typing&&storyIndex<storyLines.length)showStoryLine();if(!autoContinue)clearTimeout(autoTimer)};document.getElementById('voiceToggle').onclick=e=>{voiceOn=!voiceOn;e.currentTarget.textContent='VOICE: '+(voiceOn?'ON':'OFF');if(!voiceOn)stopVoice();else if(!typing&&storyIndex>0)speakStory(storyLines[storyIndex-1])};document.getElementById('voiceVolume').oninput=e=>{voiceVolume=+e.target.value/100};document.addEventListener('keydown',e=>{if(e.code==='Escape')return;if(document.getElementById('story').classList.contains('hide'))return;if(['Space','Enter'].includes(e.code)){e.preventDefault();if(typing){clearInterval(typeTimer);typing=false;storyText.textContent=storyLines[storyIndex-1];speakStory(storyLines[storyIndex-1])}else showStoryLine()}});document.getElementById('playBtn').onclick=()=>{document.getElementById('menu').classList.add('hide');document.getElementById('game').classList.remove('hide')};
setTimeout(()=>{fade.style.opacity='0';showStoryLine()},1000);
</script></body></html>
