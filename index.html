<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEADZONE — COMING SOON</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#e8eee9;font-family:Arial,sans-serif;overflow:hidden}button{font:inherit}.cinema{position:fixed;inset:0;background:radial-gradient(circle at 52% 45%,rgba(130,160,145,.13),transparent 20%),linear-gradient(#07100d,#020504 60%,#000);overflow:hidden}.rain{position:absolute;inset:-30%;opacity:.25;background:repeating-linear-gradient(105deg,transparent 0 13px,rgba(220,235,230,.28) 14px,transparent 15px 29px);animation:rain .55s linear infinite}.vignette{position:absolute;inset:0;background:radial-gradient(ellipse,transparent 25%,rgba(0,0,0,.9) 100%)}.street{position:absolute;left:0;right:0;bottom:0;height:48%;background:linear-gradient(#0a0e0c,#020302);transform:perspective(500px) rotateX(8deg);transform-origin:bottom}.house{position:absolute;bottom:20%;width:150px;height:115px;background:#101613;border:1px solid #303a34}.house:before{content:"";position:absolute;left:-20px;top:-55px;border-left:95px solid transparent;border-right:95px solid transparent;border-bottom:58px solid #161d19}.h1{left:8%}.h2{right:8%;transform:scale(.75)}.figure{position:absolute;right:25%;bottom:20%;width:60px;height:190px;background:#010202;border-radius:45% 45% 12% 12%;opacity:0;transition:opacity 1.2s;filter:blur(1px)}.figure:before{content:"";position:absolute;left:7px;top:-42px;width:46px;height:48px;border-radius:50%;background:#010202}.figure.show{opacity:.9}.story{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center}.panel{width:min(850px,88vw);text-align:center;margin-top:8vh}.date{font-size:10px;letter-spacing:6px;color:#7d8982;margin-bottom:22px}.text{min-height:190px;font-size:clamp(17px,2vw,21px);line-height:1.85;text-shadow:0 3px 18px #000}.hint{font-size:9px;letter-spacing:3px;color:#77837c}.skip{position:fixed;top:18px;right:20px;z-index:10;padding:9px 14px;background:#090d0b;border:1px solid #4d5952;color:#c8d2cc;letter-spacing:2px}.auto{margin-top:15px;padding:8px 14px;background:#090d0b;border:1px solid #39443e;color:#9daaa2;font-size:9px;letter-spacing:2px}.end{position:fixed;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 2.2s}.end.show{opacity:1}.endcard{text-align:center;transform:scale(.95);transition:transform 2.5s}.end.show .endcard{transform:scale(1)}.endpic{display:none;position:absolute;inset:0;background:#000 center/cover no-repeat;opacity:.72}.endsmall{font-size:11px;letter-spacing:7px;color:#6f7b74;margin-bottom:20px}.endtitle{font-size:clamp(55px,13vw,170px);letter-spacing:14px;font-weight:900;margin:0;text-shadow:0 0 40px rgba(220,235,225,.14)}.endline{margin-top:20px;font-size:11px;letter-spacing:5px;color:#7c8881}@keyframes rain{to{transform:translate(-80px,110px)}}@keyframes flick{0%,100%{filter:brightness(.8)}50%{filter:brightness(1.08)}}.cinema{animation:flick 6s ease-in-out infinite}</style></head><body><div class="cinema" id="cinema"><div class="rain"></div><div class="street"></div><div class="house h1"></div><div class="house h2"></div><div class="figure" id="figure"></div><div class="vignette"></div></div><section class="story" id="story"><button class="skip" id="skip">SKIP</button><div class="panel"><div class="date">2041 • DES MOINES, IOWA • 3:17 AM</div><div class="text" id="text"></div><div class="hint">SPACE / ENTER TO CONTINUE</div><button class="auto" id="auto">AUTOMATIC CONTINUE: OFF</button></div></section><section class="end" id="end"><div class="endpic"></div><div class="endcard"><div class="endsmall">THE STORY WILL CONTINUE</div><h1 class="endtitle">COMING SOON</h1><div class="endline">DEADZONE IS CURRENTLY IN PROGRESS</div></div></section><script>const lines=["You are Ethan Cole, a 17-year-old high-school senior.","At 3:17 AM, you wake up to a city that has gone completely silent.","No cars. No voices. No lights. Your phone has no service.","Then an emergency alert appears: DO NOT LEAVE YOUR HOME.","You look through the window. Someone is standing across the street.","Your phone vibrates again: ETHAN... DON'T OPEN THE DOOR.","BANG. Something hits the front door.","You run upstairs. Your sister Mia is gone. Her room is empty.","Her phone contains one last recording: 'Ethan... they're not people anymore.'","The power dies. You escape through the back door.","Outside, the neighborhood is abandoned. A military radio crackles nearby.","A voice breaks through the static: '...your sister is alive.'","You take the radio. You have one objective: FIND MIA.","You step into the darkness.","Then you hear something behind you.","You slowly turn around.","A shadow is standing there.","(ZOMBIE ROARS)","...you're not alone."];let n=0,typing=false,timer,auto=false,autoTimer;const text=document.getElementById('text'),figure=document.getElementById('figure'),story=document.getElementById('story'),cinema=document.getElementById('cinema'),end=document.getElementById('end');function ctx(){return window.AudioContext||window.webkitAudioContext}function tone(freq,dur,type='sine',gain=.12){try{let C=ctx();if(!C)return;let c=new C,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,c.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*.35),c.currentTime+dur);g.gain.setValueAtTime(.001,c.currentTime);g.gain.exponentialRampToValueAtTime(gain,c.currentTime+.03);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur+.03);setTimeout(()=>c.close(),dur*1000+200)}catch(e){}}function roar(){try{let C=ctx();if(!C)return;let c=new C,m=c.createGain();m.gain.value=.8;m.connect(c.destination);let o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(115,c.currentTime);o.frequency.exponentialRampToValueAtTime(27,c.currentTime+1.65);f.type='lowpass';f.frequency.setValueAtTime(700,c.currentTime);f.frequency.exponentialRampToValueAtTime(100,c.currentTime+1.7);g.gain.setValueAtTime(.001,c.currentTime);g.gain.exponentialRampToValueAtTime(.55,c.currentTime+.06);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+1.75);o.connect(f);f.connect(g);g.connect(m);o.start();o.stop(c.currentTime+1.8);setTimeout(()=>c.close(),2100)}catch(e){}}function powerCut(){try{let C=ctx();if(!C)return;let c=new C,m=c.createGain();m.gain.value=.8;m.connect(c.destination);let t=c.currentTime;for(let i=0;i<4;i++){let o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(180-i*25,t+i*.07);o.frequency.exponentialRampToValueAtTime(32,t+i*.07+.45);f.type='lowpass';f.frequency.value=900;g.gain.setValueAtTime(.001,t+i*.07);g.gain.exponentialRampToValueAtTime(.22,t+i*.07+.025);g.gain.exponentialRampToValueAtTime(.001,t+i*.07+.55);o.connect(f);f.connect(g);g.connect(m);o.start(t+i*.07);o.stop(t+i*.07+.58)}setTimeout(()=>c.close(),1900)}catch(e){}}function speak(s){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.rate=.9;u.pitch=.82;u.volume=.72;speechSynthesis.speak(u)}function next(){if(n>=lines.length){finish();return}clearTimeout(autoTimer);let s=lines[n++];if(s.includes('shadow'))figure.classList.add('show');if(s==='(ZOMBIE ROARS)')roar();text.textContent='';typing=true;let i=0;clearInterval(timer);timer=setInterval(()=>{text.textContent=s.slice(0,++i);if(i>=s.length){clearInterval(timer);typing=false;speak(s);if(auto)autoTimer=setTimeout(next,900)}},22)}function finish(){clearInterval(timer);clearTimeout(autoTimer);if('speechSynthesis'in window)speechSynthesis.cancel();story.style.display='none';cinema.style.display='none';setTimeout(()=>{end.classList.add('show');powerCut();},250)}document.getElementById('skip').onclick=finish;document.getElementById('auto').onclick=e=>{auto=!auto;e.textContent='AUTOMATIC CONTINUE: '+(auto?'ON':'OFF');if(auto&&!typing)next()};document.addEventListener('keydown',e=>{if(story.style.display==='none')return;if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(typing){clearInterval(timer);typing=false;text.textContent=lines[n-1];speak(lines[n-1])}else next()}});setTimeout(next,1200);</script></body></html>
